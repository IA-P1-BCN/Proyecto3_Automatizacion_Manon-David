schema: spec-driven

context: |
  Project: n8n automations around a given shoe-shop app (layaway system). See CLAUDE.md,
  docs/constitution.md, specs/ontologia.md and docs/decisions-clarify.md before writing artifacts.
  Language: English. Customer-facing messages (emails to customers and Marisa) are Spanish.
  App field and event names stay as the app defines them (apartado, abono, apartado.creado).
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Principles: the app is the source of truth for amounts; the AI extracts, the flow decides;
  no secrets in Git; every flow has an error branch and is idempotent.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
