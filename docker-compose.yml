services:
  tienda:
    build: .
    ports:
      - "${TIENDA_PORT:-8000}:8000"
    environment:
      - TZ=Europe/Madrid
      - DB_PATH=/data/tienda.db
      - API_KEY=${API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - SEED=${SEED:-1}
    volumes:
      - tienda_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "${N8N_PORT_HOST:-5678}:5678"
    environment:
      - TZ=Europe/Madrid
      - GENERIC_TIMEZONE=Europe/Madrid
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TIENDA_EMAIL_AVISOS=${TIENDA_EMAIL_AVISOS:-}
      - TIENDA_EMAIL_FROM=${TIENDA_EMAIL_FROM:-}
      - KDRIVE_DRIVE_ID=${KDRIVE_DRIVE_ID:-}
      - KDRIVE_DIRECTORY_ID=${KDRIVE_DIRECTORY_ID:-}
      - TIENDA_UMBRAL_VENTA_GRANDE=${TIENDA_UMBRAL_VENTA_GRANDE:-}
      - TIENDA_WEBHOOK_TOKEN=${TIENDA_WEBHOOK_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  tienda_data:
  n8n_data:
