name: Move linked issues to In Review

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, ready_for_review, edited, synchronize]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Existing pull request number to synchronize
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  update-status:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.state == 'open' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Verify project credential is configured
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error::Configure PROJECT_AUTOMATION_TOKEN with repository read and organization project write access."
            exit 1
          fi

      # Never check out the PR head: this job holds a project-write credential.
      - name: Check out trusted dev revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'dev' }}
          persist-credentials: false

      - name: Update existing issue cards
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const { synchronizeReviewStatus } = require('./.github/scripts/issue-review-status.cjs');
            await synchronizeReviewStatus({ github, context, core, prNumber: process.env.PR_NUMBER });
